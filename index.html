<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121760">
<title>Своя игра</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-database-compat.js"></script>
<style>
:root{
  --page:#E6E8F3; --ink:#181A38; --muted:#5A5F86; --line:#C8CBE0;
  --board:#121760; --cell:#2232A6; --cell-hi:#2E40C4; --cell-used:#191F6E;
  --gold:#FFC93C; --buzz:#E5383B; --buzz-dark:#A51F25; --ok:#16A36C; --bad:#D6453D;
  --phone:#FFFFFF; --phone-ink:#181A38; --chip:#FFFFFF; --soft:#F0F1F8;
  --display:"Rubik", "Arial Black", system-ui, sans-serif;
  --body:"Rubik", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#0C0E24; --ink:#E8E9F7; --muted:#9A9EC6; --line:#2A2E5C;
    --phone:#161A3E; --phone-ink:#E8E9F7; --chip:#181C45; --soft:#1F2450;
  }
}
:root[data-theme="dark"]{
  --page:#0C0E24; --ink:#E8E9F7; --muted:#9A9EC6; --line:#2A2E5C;
  --phone:#161A3E; --phone-ink:#E8E9F7; --chip:#181C45; --soft:#1F2450;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--page);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.wrap{max-width:1280px;margin:0 auto;padding:20px 20px 32px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.top h1{font-family:var(--display);font-weight:900;font-size:clamp(22px,3vw,30px);letter-spacing:-.01em;margin:0}
.top p{margin:0;color:var(--muted);font-size:14px;max-width:60ch}

.tabs{display:none;gap:6px;margin-bottom:12px;background:var(--chip);padding:4px;border-radius:12px;border:1px solid var(--line)}
.tabs button{flex:1;border:0;background:transparent;color:var(--ink);padding:10px;border-radius:9px;font-weight:700;position:relative}
.tabs button[aria-selected="true"]{background:var(--board);color:#fff}
.tabs .dot{position:absolute;top:8px;right:14px;width:9px;height:9px;border-radius:50%;background:var(--buzz);display:none}
.tabs .dot.on{display:block}

.stage{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start}

/* TV / host screen */
.tv{background:var(--board);color:#fff;border-radius:22px;padding:18px;box-shadow:0 18px 40px -20px rgba(18,23,96,.7)}
.tv-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.tv-title{font-family:var(--display);font-weight:800;font-size:15px;color:var(--gold)}
.tv-head .ghost{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:10px;padding:7px 12px;font-size:13px;font-weight:700}
.tv-head .ghost:hover{border-color:var(--gold);color:var(--gold)}

.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.pl{background:rgba(255,255,255,.07);border-radius:14px;padding:10px 12px;border:2px solid transparent;transition:border-color .2s}
.pl.choose{border-color:rgba(255,201,60,.55)}
.pl.resp{border-color:var(--gold);background:rgba(255,201,60,.14)}
.pl .nm{font-size:13px;opacity:.85;display:flex;justify-content:space-between;gap:6px}
.pl .nm em{font-style:normal;color:var(--gold);font-weight:700;font-size:12px}
.pl .sc{font-family:var(--display);font-weight:800;font-size:24px;font-variant-numeric:tabular-nums}
.pl .sc.neg{color:#FF8A84}

.board{display:grid;grid-template-columns:minmax(110px,1.6fr) repeat(5,minmax(52px,1fr));gap:6px;overflow-x:auto}
.theme{background:rgba(255,255,255,.06);border-radius:8px;padding:10px;font-weight:800;font-size:14px;display:flex;align-items:center}
.cell{background:var(--cell);border:0;border-radius:8px;color:var(--gold);font-family:var(--display);font-weight:800;font-size:clamp(15px,1.8vw,22px);min-height:56px;transition:background .15s,transform .1s}
.cell:hover:not(:disabled){background:var(--cell-hi)}
.cell:active:not(:disabled){transform:scale(.97)}
.cell:disabled{background:var(--cell-used);color:transparent;cursor:default}

.q{min-height:336px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px 18px;background:var(--cell);border-radius:14px;position:relative}
.q .meta{font-size:14px;color:var(--gold);font-weight:700;margin-bottom:14px}
.q .text{font-family:var(--display);font-weight:500;font-size:clamp(19px,2.4vw,28px);line-height:1.3;max-width:28ch}
.q .big{font-family:var(--display);font-weight:900;font-size:clamp(34px,5vw,56px);color:var(--gold);line-height:1.1}
.q .sub{margin-top:12px;font-size:15px;opacity:.85;max-width:48ch}
.bar{position:absolute;left:0;bottom:0;height:6px;background:var(--gold);border-radius:0 0 0 14px;animation:shrink linear forwards;width:100%}
.bar.read{background:rgba(255,255,255,.45);animation-name:grow}
@keyframes shrink{from{width:100%}to{width:0}}
@keyframes grow{from{width:0}to{width:100%}}

.host{margin-top:14px;background:rgba(0,0,0,.25);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.host .lbl{font-size:13px;opacity:.7}
.host .ans{font-weight:800;color:var(--gold);flex:1;min-width:140px}
.host .btns{display:flex;gap:8px}
.hb{border:0;border-radius:10px;padding:10px 16px;font-weight:800;color:#fff}
.hb.ok{background:var(--ok)} .hb.bad{background:var(--bad)} .hb.neutral{background:rgba(255,255,255,.14)}
.hb:disabled{opacity:.35;cursor:default}
.judge-list{display:grid;gap:8px;width:100%}
.judge-row{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);border-radius:10px;padding:8px 10px;flex-wrap:wrap}
.judge-row .who{font-weight:800;min-width:90px}
.judge-row .said{flex:1;opacity:.9}
.judge-row .done{font-weight:800}

/* Phone */
.phone-col{position:sticky;top:calc(16px + env(safe-area-inset-top,0px))}
.phone{background:#0A0B1C;border-radius:44px;padding:12px;box-shadow:0 24px 50px -24px rgba(0,0,0,.6)}
.screen{background:var(--phone);color:var(--phone-ink);border-radius:34px;min-height:640px;display:flex;flex-direction:column;overflow:hidden}
.ph-top{padding:22px 20px 14px;display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--line)}
.ph-top .me{font-size:13px;color:var(--muted)}
.ph-top .me b{display:block;color:var(--phone-ink);font-size:16px}
.ph-top .sc{font-family:var(--display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums}
.ph-rivals{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--soft)}
.rv{flex:1;border-radius:10px;padding:6px 10px;border:2px solid transparent;background:var(--phone);min-width:0}
.rv.act{border-color:var(--gold)}
.rv .n{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;justify-content:space-between;gap:4px}
.rv .n i{font-style:normal;color:var(--ok);font-weight:800}
.rv .s{font-family:var(--display);font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.rv .s.neg{color:var(--bad)}
.ph-body{flex:1;display:flex;flex-direction:column;padding:18px 20px 24px;gap:14px}
.status{font-weight:800;font-size:18px;line-height:1.3}
.hint{color:var(--muted);font-size:14px}
.buzz-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:300px}
.buzzer{width:230px;height:230px;border-radius:50%;border:0;background:radial-gradient(circle at 38% 32%,#FF7A7D 0%,var(--buzz) 45%,var(--buzz-dark) 100%);box-shadow:0 12px 0 var(--buzz-dark),0 24px 40px -10px rgba(229,56,59,.6);color:#fff;font-family:var(--display);font-weight:900;font-size:30px;transition:transform .06s,box-shadow .06s}
.buzzer:active:not(:disabled),.buzzer.pressed{transform:translateY(10px);box-shadow:0 2px 0 var(--buzz-dark),0 8px 20px -8px rgba(229,56,59,.6)}
.buzzer.live{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 12px 0 var(--buzz-dark),0 0 0 0 rgba(229,56,59,.45)}50%{box-shadow:0 12px 0 var(--buzz-dark),0 0 0 22px rgba(229,56,59,0)}}
.buzzer:disabled{background:radial-gradient(circle at 38% 32%,#C9CBD8 0%,#9EA1B8 60%,#7D8099 100%);box-shadow:0 12px 0 #5F6280;cursor:default;font-size:20px}
.buzzer.early{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.timer{width:100%;height:8px;background:var(--soft);border-radius:8px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--buzz);animation:shrink linear forwards}
.kbd{font-size:12px;color:var(--muted)}

.mini{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.mini .t{grid-column:1/-1;font-size:12px;font-weight:800;color:var(--muted);margin-top:6px}
.mini button{border:0;border-radius:8px;background:var(--board);color:var(--gold);font-family:var(--display);font-weight:800;font-size:13px;padding:11px 0}
.mini button:disabled{background:var(--soft);color:transparent}

.choices{display:grid;gap:10px}
.pbtn{border:0;border-radius:14px;padding:16px;font-weight:800;font-size:16px;background:var(--board);color:#fff;text-align:left;display:flex;justify-content:space-between}
.pbtn.alt{background:var(--soft);color:var(--phone-ink)}
.pbtn.hot{background:var(--buzz)}
.pbtn:disabled{opacity:.4;cursor:default}
.card{background:var(--soft);border-radius:16px;padding:16px}
.card .k{font-size:13px;color:var(--muted)}
.card .v{font-family:var(--display);font-weight:800;font-size:28px}
input[type=range]{width:100%;accent-color:var(--buzz)}
.field{width:100%;border:2px solid var(--line);background:var(--phone);color:var(--phone-ink);border-radius:12px;padding:14px;font:inherit;font-size:16px}
.pill{display:inline-block;padding:4px 10px;border-radius:99px;font-size:13px;font-weight:800}
.pill.ok{background:rgba(22,163,108,.15);color:var(--ok)} .pill.bad{background:rgba(214,69,61,.15);color:var(--bad)}

.setup{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
.set-col{display:grid;gap:12px;align-content:start}
.opt{background:rgba(255,255,255,.06);border-radius:14px;padding:12px 14px}
.opt h3{margin:0 0 8px;font-size:15px;font-weight:800}
.opt p{margin:8px 0 0;font-size:13px;opacity:.75;max-width:52ch}
.seg{display:flex;gap:4px;background:rgba(0,0,0,.25);border-radius:11px;padding:4px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:transparent;color:#fff;border-radius:8px;padding:8px 10px;font-weight:700;font-size:14px;min-width:max-content}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--board)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{border:2px solid rgba(255,255,255,.25);background:transparent;color:#fff;border-radius:99px;padding:7px 14px;font-weight:700;font-size:14px}
.chips button[aria-pressed="true"]{border-color:var(--gold);background:rgba(255,201,60,.15);color:var(--gold)}
.pack{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pack b{display:block}
.pack span{font-size:13px;opacity:.75}
.pack .soon{border:1px dashed rgba(255,255,255,.35);background:transparent;color:rgba(255,255,255,.6);border-radius:10px;padding:8px 12px;font-weight:700;font-size:13px;cursor:not-allowed}
.lobby{background:rgba(0,0,0,.22);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
.code{display:flex;gap:14px;align-items:center}
.code svg{width:92px;height:92px;background:#fff;border-radius:8px;padding:6px;flex:none}
.code .k{font-size:13px;opacity:.75}
.code .v{font-family:var(--display);font-weight:900;font-size:36px;color:var(--gold);letter-spacing:.06em}
.joined{display:grid;gap:6px}
.joined div{display:flex;justify-content:space-between;background:rgba(255,255,255,.06);border-radius:10px;padding:9px 12px;font-weight:700}
.joined div span{font-size:13px;opacity:.7;font-weight:600}
.joined .wait{opacity:.5;font-weight:600;border:1px dashed rgba(255,255,255,.3);background:transparent}
.start{border:0;border-radius:14px;padding:16px;background:var(--gold);color:var(--board);font-family:var(--display);font-weight:800;font-size:17px}
.start:disabled{opacity:.4;cursor:default}
.cell.said{outline:3px solid var(--gold);outline-offset:-3px;background:var(--cell-hi)}
.summary{display:grid;gap:6px}
.summary div{display:flex;justify-content:space-between;gap:10px;font-size:14px;border-bottom:1px solid var(--line);padding-bottom:6px}
.summary div span:first-child{color:var(--muted)}
.summary div span:last-child{font-weight:700;text-align:right}
@media (max-width: 1100px){ .setup{grid-template-columns:1fr} }
.notes{margin-top:22px;color:var(--muted);font-size:14px;max-width:72ch}
.notes b{color:var(--ink)}

@media (max-width: 920px){
  .tabs{display:flex}
  .stage{grid-template-columns:1fr}
  .stage[data-view="tv"] .phone-col{display:none}
  .stage[data-view="phone"] .tv{display:none}
  .phone-col{position:static;max-width:400px;margin:0 auto;width:100%}
  .wrap{padding:14px 12px 24px}
  .q{min-height:280px}
}
@media (max-width: 520px){
  .phone{padding:0;background:transparent;box-shadow:none}
  .screen{border-radius:22px;border:1px solid var(--line)}
  .scores{gap:6px} .pl{padding:8px} .pl .sc{font-size:19px}
  .tv{padding:12px;border-radius:16px}
}
@media (prefers-reduced-motion: reduce){
  .buzzer.live,.buzzer.early{animation:none}
}
/* home */
.home{display:flex;flex-direction:column;gap:14px;flex:1}
.brand{font-family:var(--display);font-weight:900;font-size:34px;line-height:1;letter-spacing:-.01em;margin-top:8px}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:14px;color:var(--muted);letter-spacing:0;margin-top:8px}
.entry{border:0;border-radius:18px;padding:18px;text-align:left;display:grid;gap:4px;background:var(--soft);color:var(--phone-ink);border:2px solid transparent}
.entry b{font-family:var(--display);font-weight:800;font-size:19px}
.entry span{font-size:14px;color:var(--muted);line-height:1.35}
.entry.main{background:var(--board);color:#fff}
.entry.main span{color:rgba(255,255,255,.75)}
.entry:hover{border-color:var(--gold)}
.back{border:0;background:none;color:var(--muted);padding:0;font-weight:700;font-size:14px;align-self:flex-start}
.codein{font-family:var(--display);font-weight:800;font-size:34px;letter-spacing:.3em;text-align:center}
.err-t{color:var(--bad);font-weight:700;font-size:14px}
.room{background:var(--soft);border-radius:16px;padding:14px;display:grid;gap:6px}
.room .r1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.room b{font-size:16px}
.room .meta2{font-size:13px;color:var(--muted)}
.room .pbtn{padding:12px 14px;font-size:15px}
.pill.wait{background:rgba(255,201,60,.22);color:#8A6400}
.pill.play{background:rgba(214,69,61,.15);color:var(--bad)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .pill.wait{color:var(--gold)} }
:root[data-theme="dark"] .pill.wait{color:var(--gold)}
.splash{min-height:420px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px;padding:24px}
.splash .big{font-family:var(--display);font-weight:900;font-size:clamp(40px,6vw,72px);color:var(--gold);line-height:1}
.splash p{max-width:44ch;opacity:.85;margin:0}
.access-badge{display:inline-block;font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.12)}
.access-badge.pub{background:rgba(22,163,108,.3)}
.tin{width:100%;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.25);color:#fff;border-radius:10px;padding:10px 12px;font:inherit;margin-top:8px}

/* library */
.lib-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ltabs{display:flex;gap:4px;background:rgba(0,0,0,.25);border-radius:11px;padding:4px}
.ltabs button{border:0;background:transparent;color:#fff;border-radius:8px;padding:8px 14px;font-weight:700;font-size:14px}
.ltabs button[aria-selected="true"]{background:var(--gold);color:var(--board)}
.packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.pk{background:rgba(255,255,255,.06);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;border:2px solid transparent}
.pk.sel{border-color:var(--gold)}
.pk b{font-size:16px}
.pk .st{font-size:13px;opacity:.75}
.pk .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.sb{border:0;border-radius:9px;padding:8px 12px;font-weight:800;font-size:13px;background:rgba(255,255,255,.14);color:#fff}
.sb.gold{background:var(--gold);color:var(--board)}
.sb.red{background:transparent;color:#FF8A84;border:1px solid rgba(255,138,132,.5)}
.empty{opacity:.7;padding:24px;text-align:center;border:1px dashed rgba(255,255,255,.3);border-radius:14px}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;border:2px dashed rgba(255,255,255,.35);border-radius:14px;padding:22px;cursor:pointer;transition:border-color .15s,background .15s}
.drop.over,.drop:hover{border-color:var(--gold);background:rgba(255,201,60,.08)}
.drop b{font-size:16px}
.drop span{font-size:13px;opacity:.75}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.up-grid{display:grid;gap:12px}
.ta{width:100%;min-height:170px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.25);color:#fff;padding:12px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;resize:vertical}
.fmt{font-size:13px;opacity:.8;line-height:1.6}
.fmt code{background:rgba(0,0,0,.3);padding:1px 6px;border-radius:5px;font-size:12.5px}
.msg{border-radius:10px;padding:10px 12px;font-size:14px;font-weight:700}
.msg.err{background:rgba(214,69,61,.2);color:#FFB3AE}
.msg.info{background:rgba(255,255,255,.08)}

/* editor */
.ed-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.ed-title{flex:1;min-width:180px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.25);color:#fff;border-radius:10px;padding:10px 12px;font:inherit;font-weight:800;font-size:16px}
.issues{border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px;background:rgba(22,163,108,.18)}
.issues.has-err{background:rgba(214,69,61,.2)}
.issues.has-warn{background:rgba(255,201,60,.14)}
.issues ul{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:3px}
.issues li button{background:none;border:0;color:inherit;padding:0;text-align:left;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.issues .e{color:#FFB3AE}.issues .w{color:#FFE29A}
.rtabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.rtabs button{border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;border-radius:99px;padding:6px 12px;font-weight:700;font-size:13px}
.rtabs button[aria-pressed="true"]{background:#fff;color:var(--board)}
.ed-board{display:grid;gap:6px;overflow-x:auto;padding-bottom:4px}
.ed-row{display:flex;gap:6px;align-items:stretch}
.ed-theme{width:150px;flex:none;display:flex;gap:4px}
.ed-theme input{width:100%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;border-radius:8px;padding:8px;font:inherit;font-weight:800;font-size:14px}

const TYPES = {normal:"Обычный", cat:"Кот в мешке", auction:"Аукцион", norisk:"Без риска"};

/* ================= storage ================= */
function load(k, d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
const CFG_DEFAULTS = {picker:"host", window:7000, minus:true, early:true, cat:true, auction:true, final:true, access:"private", roomName:"Моя игра", max:6, phoneImg:false, host:"live", format:"classic", ansTime:25000, quizTime:20000, quizMinus:false};

function stats(p){
  const th=p.rounds.reduce((a,r)=>a+r.themes.length,0), q=p.rounds.reduce((a,r)=>a+r.themes.reduce((b,t)=>b+t.questions.length,0),0);
  return `${p.rounds.length>1?p.rounds.length+" раунда · ":""}${th} ${plural(th,"тема","темы","тем")}, ${q} ${plural(q,"вопрос","вопроса","вопросов")}${p.final?", финал":""}`;

function plural(n,a,b,c){ const m=n%10, h=n%100; return m===1&&h!==11?a: m>=2&&m<=4&&(h<10||h>=20)?b:c; }

/* ================= images (IndexedDB) ================= */
const IMG={cache:{}, db:null};
function idb(){
  if(!IMG.db) IMG.db=new Promise((res,rej)=>{ if(!window.indexedDB) return rej(new Error("no idb")); const r=indexedDB.open("svoya-media",1); r.onupgradeneeded=()=>r.result.createObjectStore("img"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
  return IMG.db;

async function imgPut(data){
  const id="i"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  IMG.cache[id]=data;
  try{ const d=await idb(); await new Promise((res,rej)=>{ const tx=d.transaction("img","readwrite"); tx.objectStore("img").put(data,id); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); }); }catch(e){ console.warn(e); }
  return id;
}
async function imgGet(id){
  if(!id) return null; if(IMG.cache[id]) return IMG.cache[id];
  try{ const d=await idb(); const v=await new Promise((res,rej)=>{ const r=d.transaction("img").objectStore("img").get(id); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); if(v) IMG.cache[id]=v; return v||null; }catch(e){ return null; }
}

  if(!q) return null; if(q.url) return q.url;

  return null;

async function compressImage(blob, max=1280){
  const url=URL.createObjectURL(blob);
  try{
    const im=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error("Не удалось открыть картинку")); i.src=url; });
    const k=Math.min(1, max/Math.max(im.naturalWidth, im.naturalHeight)), w=Math.max(1,Math.round(im.naturalWidth*k)), h=Math.max(1,Math.round(im.naturalHeight*k));
    const c=document.createElement("canvas"); c.width=w; c.height=h; const x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,w,h); x.drawImage(im,0,0,w,h);
    let d=c.toDataURL("image/webp",0.78); if(!d.startsWith("data:image/webp")) d=c.toDataURL("image/jpeg",0.8);
    if(d.length>400000) d=c.toDataURL("image/jpeg",0.6);

  } finally { URL.revokeObjectURL(url); }

/* ================= validation ================= */
function validate(p){
  const out=[]; const add=(lvl,msg,r,ti,qi)=>out.push({lvl,msg,r,ti,qi});
  if(!p.title||!p.title.trim()) add("err","Нет названия пака");
  if(!p.rounds.length || p.rounds.every(r=>!r.themes.length)) add("err","В паке нет ни одной темы");
  p.rounds.forEach((r,ri)=>{
    r.themes.forEach((t,ti)=>{
      const tn = t.name&&t.name.trim() ? "«"+t.name.trim()+"»" : "тема "+(ti+1);
      if(!t.name||!t.name.trim()) add("err",`${r.name}: у темы ${ti+1} нет названия`,ri,ti,null);
      if(!t.questions.length) add("err",`${tn}: нет вопросов`,ri,ti,null);
      else if(t.questions.length!==5) add("warn",`${tn}: ${t.questions.length} ${plural(t.questions.length,"вопрос","вопроса","вопросов")}, обычно 5`,ri,ti,null);
      let prev=0, unordered=false;
      t.questions.forEach((q,qi)=>{
        const where=`${tn}, ${q.cost||"?"}`;
        if((!q.text||!q.text.trim()) && !q.img && !q.url) add("err",`${where}: нет текста вопроса`,ri,ti,qi);
        if(!q.answer||!q.answer.trim()) add("err",`${where}: нет ответа`,ri,ti,qi);
        if(!(q.cost>0)) add("err",`${where}: стоимость должна быть больше нуля`,ri,ti,qi);
        if(q.cost<=prev) unordered=true; prev=q.cost;
        if(q.media) add("warn",`${where}: аудио и видео пока не поддерживаются`,ri,ti,qi);
        if(q.choices && q.answer && !q.choices.some(x=>normA(x)===normA(q.answer))) add("warn",`${where}: ответа нет среди вариантов`,ri,ti,qi);
      });
      if(unordered && t.questions.length) add("warn",`${tn}: стоимости идут не по возрастанию`,ri,ti,null);

function blankPack(title){ return {id:null, title:title||"Новый пак", author:"Вы", rounds:[{name:"Раунд 1", themes:[]}], final:null}; }
function typeFromWord(w){
  w=(w||"").toLowerCase();
  if(/кот|cat|secret|bagcat/.test(w)) return "cat";
  if(/аукц|ставк|stake|auction/.test(w)) return "auction";
  if(/риск|norisk|sponsor/.test(w)) return "norisk";
  return "normal";
}
function parseText(txt, title){

  const ensureTheme=()=>{ if(!theme){ theme={name:"Без названия",questions:[]}; round.themes.push(theme); } return theme; };
  const pushQ=(cost,text,answer,type)=>{
    if(inFinal){ p.final.text=text; p.final.answer=answer; return; }
    const t=ensureTheme(); const c = cost || (t.questions.length? t.questions[t.questions.length-1].cost+100 : 100);
    t.questions.push({cost:c,text,answer,type});
  };
  txt.replace(/\r/g,"").split("\n").forEach((raw,i)=>{
    const line=raw.trim(); if(!line) return;
    let m;
    if((m=line.match(/^(?:неверные\s+)?варианты\s*[:\-–—]\s*(.+)$/i))){

      return;
    }

    if((m=line.match(/^#*\s*финал\s*[:\-–—]?\s*(.*)$/i))){ inFinal=true; p.final={theme:m[1].trim()||"Финал",text:"",answer:""}; return; }
    if((m=line.match(/^(?:раунд|round)\s*[:\-–—]?\s*(.*)$/i)) && !line.includes("=")){
      if(round.themes.length){ round={name:m[1].trim()?("Раунд "+m[1].trim()).replace(/^Раунд\s+Раунд/i,"Раунд"):"Раунд "+(p.rounds.length+1),themes:[]}; p.rounds.push(round); }
      theme=null; inFinal=false; return;
    }
    if((m=line.match(/^#+\s*(.+)$/)) || (m=line.match(/^тема\s*[:\-–—]\s*(.+)$/i))){ inFinal=false; theme={name:m[1].trim(),questions:[]}; round.themes.push(theme); return; }
    m=line.match(/^(?:[-*•]\s*)?(?:(\d{2,5})\s*[.):\-–—]?\s*)?(?:\[([^\]]+)\]\s*)?(.+)$/);
    let cost=m[1]?+m[1]:null, type=m[2]?typeFromWord(m[2]):"normal", body=m[3];
    if(!cost && !inFinal) body=body.replace(/^\d{1,2}[.)]\s+/,"");
    const sep = body.match(/^(.+?)\s*(?:=|\|\s*|—\s*ответ\s*:|ответ\s*:)\s*(.+)$/i);
    if(sep){ pushQ(cost, sep[1].trim(), sep[2].trim(), type); return; }
    if(inFinal){
      if(!p.final.text) p.final.text=body.trim();
      else if(!p.final.answer) p.final.answer=body.replace(/^ответ\s*[:\-–—]\s*/i,"").trim();
      return;
    }
    if(!cost) body=body.replace(/^\d{1,2}[.)]\s+/,"");
    if(cost || /\?$/.test(body)){ pending={cost,text:body.trim(),type}; return; }
    p.notes.push(`Строка ${i+1} не распознана: «${line.slice(0,40)}»`);
  });
  if(pending) { p.notes.push(`У вопроса «${pending.text.slice(0,30)}…» нет ответа`); pushQ(pending.cost,pending.text,"",pending.type); }

}
function parseRows(rows, title){
  const p=blankPack(title); p.notes=[];
  rows = rows.filter(r=>r && r.some(c=>String(c??"").trim()));
  if(!rows.length) return p;
  const h=rows[0].map(c=>String(c??"").toLowerCase());
  const find=re=>h.findIndex(c=>re.test(c));
  let col={opts:find(/вариант|неверн|option|wrong/), round:find(/раунд|round/), theme:find(/тем|theme|topic/), cost:find(/стоим|цен|cost|price|балл|очк/), q:find(/вопрос|question/), a:find(/ответ|answer/), type:find(/тип|type/)};
  if(col.q<0||col.a<0){ col={round:-1,theme:0,cost:1,q:2,a:3,type:4}; } else rows=rows.slice(1);
  const rmap={};
  rows.forEach((r,i)=>{
    const g=k=>col[k]>=0?String(r[col[k]]??"").trim():"";
    const th=g("theme")||"Без названия", text=g("q"), ans=g("a");
    if(/^финал/i.test(th) || /^финал/i.test(g("round"))){ p.final={theme:th.replace(/^финал\s*[:\-–—]?\s*/i,"")||"Финал",text,answer:ans}; return; }

    if(!rmap[rn]){ rmap[rn]= rn==="Раунд 1"&&!p.rounds[0].themes.length&&!Object.keys(rmap).length ? p.rounds[0] : (p.rounds.push({name:rn,themes:[]}), p.rounds[p.rounds.length-1]); rmap[rn].name=rn; }
    const R=rmap[rn]; let t=R.themes.find(x=>x.name===th); if(!t){ t={name:th,questions:[]}; R.themes.push(t); }
    const c=parseInt(g("cost").replace(/\s/g,""),10);
    const nq={cost:c>0?c:(t.questions.length+1)*100, text, answer:ans, type:typeFromWord(g("type"))};
    const ol=g("opts"); if(ol){ const na=normA(ans), l=ol.split(/[;|]/).map(x=>x.trim()).filter(Boolean); if(l.some(x=>normA(x)===na) && l.length>=2) nq.choices=l.slice(0,6); else nq.wrong=l.filter(x=>normA(x)!==na).slice(0,5); }
    t.questions.push(nq);
  });

}
function parseCSV(txt){
  txt=txt.replace(/^\uFEFF/,"");
  const first=txt.split("\n")[0]; const counts={";":first.split(";").length,",":first.split(",").length,"\t":first.split("\t").length};
  const d=Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0];
  const rows=[]; let row=[], cell="", q=false;
  for(let i=0;i<txt.length;i++){
    const ch=txt[i];
    if(q){ if(ch==='"'){ if(txt[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=ch; }
    else if(ch==='"') q=true;
    else if(ch===d){ row.push(cell); cell=""; }
    else if(ch==="\n"){ row.push(cell.replace(/\r$/,"")); rows.push(row); row=[]; cell=""; }
    else cell+=ch;
  }
  if(cell||row.length){ row.push(cell); rows.push(row); }
  return rows;
}
function parseSiqXml(xml, title){
  const doc=new DOMParser().parseFromString(xml,"application/xml");
  const pk=doc.getElementsByTagName("package")[0];
  const p=blankPack((pk&&pk.getAttribute("name"))||title); p.rounds=[]; p.notes=[];
  const kids=(el,tag)=>Array.from(el.children).filter(c=>c.localName===tag);
  const one=(el,tag)=>kids(el,tag)[0];
  function readQ(q){
    let text="", media=null, imgRef=null, url=null;
    const takeImg=v=>{ v=(v||"").trim(); if(!v) return; if(/^https?:\/\//i.test(v)) url=v; else imgRef=v.replace(/^@/,""); };
    const params=one(q,"params"); let choices=null, letters=null;
    if(params){
      const ao=kids(params,"param").find(x=>x.getAttribute("name")==="answerOptions");
      if(ao){ const ops=kids(ao,"param"); if(ops.length>=2){ letters=ops.map(o=>(o.getAttribute("name")||"").trim()); choices=ops.map(o=>kids(o,"item").map(it=>{ const t=it.getAttribute("type"); return !t||t==="text" ? it.textContent.trim() : "["+(t==="image"?"картинка":"медиа")+"]"; }).join(" ").trim()); } }
      const qp=kids(params,"param").find(x=>x.getAttribute("name")==="question");
      if(qp) kids(qp,"item").forEach(it=>{ const t=it.getAttribute("type"); if(!t||t==="text") text+=(text?" ":"")+it.textContent.trim(); else if(t==="image") takeImg(it.textContent); else media=t; });
    }
    const sc=one(q,"scenario");
    if(sc) kids(sc,"atom").forEach(a=>{ const t=a.getAttribute("type"); if(!t||t==="text"||t==="say") text+=(text?" ":"")+a.textContent.trim(); else if(t==="image") takeImg(a.textContent); else if(t!=="marker") media=t; });

    let type=q.getAttribute("type")||""; const tEl=one(q,"type"); if(tEl) type=tEl.getAttribute("name")||type;
    if(!text && media) text=`[${media==="image"?"картинка":media==="voice"||media==="audio"?"аудио":media==="video"?"видео":"медиа"}]`;
    let answer=ans;
    if(choices){ const li=letters.findIndex(l=>l.toLowerCase()===ans.trim().toLowerCase()); if(li>=0) answer=choices[li]; }
    const o={cost:+q.getAttribute("price")||0, text, answer, type:typeFromWord(type), media};

  }

    if(r.getAttribute("type")==="final"){

      return;
    }

  });

  return p;
}
const libs={};
function loadScript(url){
  if(!libs[url]) libs[url]=new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=url; s.onload=res; s.onerror=()=>rej(new Error("Не удалось загрузить библиотеку")); document.head.appendChild(s); });
  return libs[url];
}
async function importFile(file){
  const name=file.name, ext=(name.split(".").pop()||"").toLowerCase(), base=name.replace(/\.[^.]+$/,"");
  if(ext==="siq"||ext==="zip"){
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js");
    const zip=await JSZip.loadAsync(file); const f=zip.file("content.xml");
    if(!f) throw new Error("В архиве нет content.xml. Это точно пак SIGame?");
    const p=parseSiqXml(await f.async("string"), base);
    const names=Object.keys(zip.files);
    const findImg=name=>{
      for(const c of [name, encodeURIComponent(name), encodeURI(name)]){ const z=zip.file("Images/"+c); if(z) return z; }
      const low=name.toLowerCase();
      const k=names.find(fn=>{ const b=fn.split("/").pop(); let d=b; try{ d=decodeURIComponent(b); }catch(e){} return d.toLowerCase()===low || b.toLowerCase()===low; });
      return k?zip.file(k):null;
    };
    const qs=[]; p.rounds.forEach(r=>r.themes.forEach(t=>t.questions.forEach(q=>{ if(q._imgRef) qs.push(q); })));
    let miss=0;
    for(const q of qs){
      const z=findImg(q._imgRef); delete q._imgRef;
      if(!z){ miss++; continue; }
      try{ q.img=await imgPut(await compressImage(await z.async("blob"))); }catch(e){ miss++; }
    }
    if(miss) p.notes.push(`${miss} ${plural(miss,"картинку","картинки","картинок")} не удалось извлечь из архива`);
    return p;
  }
  if(ext==="json"){
    const j=JSON.parse(await file.text());
    if(!j.rounds) throw new Error("В JSON нет поля rounds: это не пак в формате приложения");
    return Object.assign(blankPack(base), j, {id:null});
  }
  if(ext==="csv"||ext==="tsv") return parseRows(parseCSV(await file.text()), base);
  if(ext==="xlsx"||ext==="xls"){
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");
    const wb=XLSX.read(await file.arrayBuffer()); const sh=wb.Sheets[wb.SheetNames[0]];
    return parseRows(XLSX.utils.sheet_to_json(sh,{header:1,defval:""}), base);
  }
  if(ext==="docx"){
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js");
    const r=await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});
    return parseText(r.value, base);
  }
  if(ext==="txt"||ext==="md") return parseText(await file.text(), base);
  if(ext==="pdf"||["jpg","jpeg","png","heic","webp"].includes(ext)) throw new Error("PDF и фото будут через распознавание текста в приложении. Пока вставьте текст вручную.");
  throw new Error(`Формат .${ext} не поддерживается`);
}

function onInput(pid, v){

    case "pick": if(h.phase==="board" && picker()==="player" && h.chooser===pid) pick(+v.ti,+v.qi); break;

    case "opt": quizPick(pid, v); break;
    case "cat": if(h.phase==="cat" && h.chooser===pid && v.to!==pid && HOST.players[v.to]) catGive(v.to); break;
    case "auc": if(h.phase==="auction" && h.auc.queue[0]===pid) aucAct(pid, v.act); break;
    case "bet": if(h.phase==="final-bet" && h.fin.ids.includes(pid) && h.fin.bets[pid]==null){ const max=Math.max(1,(HOST.players[pid]||{}).score||0); h.fin.bets[pid]=Math.max(1,Math.min(max,Math.round(+v.v||1))); checkBets(); } break;
    case "fa": if(h.phase==="final-answer" && h.fin.ids.includes(pid) && h.fin.answers[pid]==null){ h.fin.answers[pid]=String(v.text||"").trim().slice(0,120)||"—"; checkAnswers(); } break;

/* ---------- host game flow ---------- */
const AUTO = () => CFG.host==="auto";
const QUIZ = () => CFG.format==="quiz";
const picker = () => (AUTO()||QUIZ()) ? "player" : CFG.picker;
function autoLater(ms, fn){ if(AUTO()) later(fn, ms); }
function normA(x){ return String(x||"").toLowerCase().replace(/ё/g,"е").replace(/[«»"'“”„.,!?()\[\]\-–—:;]/g," ").replace(/\s+/g," ").trim(); }
function lev(a,b){ if(Math.abs(a.length-b.length)>2) return 9; const d=Array.from({length:a.length+1},(_,i)=>[i]); for(let j=1;j<=b.length;j++) d[0][j]=j; for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[a.length][b.length]; }
function matchAnswer(said, ans){
  const s=normA(said); if(!s) return false;
  const vs=[normA(ans), ...String(ans||"").split(/[,;\/]|\sили\s|\(/i).map(normA)].filter(Boolean);
  return vs.some(v=> s===v || (s.length>=3 && s.includes(v) && v.length>=3) || (s.length>=4 && v.includes(s) && s.length>=v.length*.6) || (v.length>=5 && lev(s,v)<=(v.length>=9?2:1)));
}
/* ---- stats ---- */
function stP(id){ const st=H().st; if(!st.pl[id]) st.pl[id]={right:0, wrong:0, best:null}; return st.pl[id]; }
function stRight(id, reaction){ const p=stP(id); p.right++; if(reaction!=null && (p.best==null || reaction<p.best)) p.best=Math.round(reaction*100)/100; }
function stWrong(id){ stP(id).wrong++; }
function stQ(){ const h=H(); return h.st.qs[h.st.qs.length-1]; }

function startGame(){
  const ids=online(); if(!ids.length || validate(PACK).some(x=>x.lvl==="err")) return;
  clearTimers(); keepAwake();
  order().forEach(id=>{ HOST.players[id].score=0; hRef(`players/${id}/score`).set(0); });
  Object.assign(H(),{phase:"board", round:0, used:{}, chooser:ids[0], cur:null, responder:null, tried:{}, msg:"", auc:null, fin:null, quiz:null, st:{pl:{}, qs:[]}});
  hRef("buzz").remove(); hRef("input").remove(); hRef("media").remove(); HOST.seen={}; preloadPackImages();
  S.view="game"; if(AUTO() && PL) APP.mode="player";
  armBoard(); pushState();
}
function armBoard(){
  const h=H(); if(!AUTO()) return;
  if(!HOST.players[h.chooser] || HOST.players[h.chooser].online===false){ const ids=online(); if(ids.length) h.chooser=ids[Math.floor(Math.random()*ids.length)]; }
  const n=Object.keys(h.used).length, r=h.round;
  later(()=>{ const x=H(); if(x.phase==="board" && x.round===r && Object.keys(x.used).length===n){ const f=[]; PACK.rounds[r].themes.forEach((t,ti)=>t.questions.forEach((_,qi)=>{ if(!x.used[ti+"-"+qi]) f.push([ti,qi]); })); if(f.length){ const [a,b]=f[Math.floor(Math.random()*f.length)]; pick(a,b); } } }, 30000);
}
function pick(ti,qi){
  const h=H(), key=ti+"-"+qi, th=PACK.rounds[h.round].themes[ti], item=th&&th.questions[qi];
  if(h.phase!=="board" || !item || h.used[key]) return;
  clearTimers(); h.used[key]=true; if(!h.st) h.st={pl:{}, qs:[]};
  let sp=item.type||"normal";
  if(sp==="cat"&&!CFG.cat) sp="normal"; if(sp==="auction"&&!CFG.auction) sp="normal";
  if(QUIZ()) sp="normal";
  if(!HOST.players[h.chooser]) h.chooser=online()[0]||null;
  h.cur={ti,qi,theme:th.name,cost:item.cost,text:item.text,answer:item.answer,sp,direct:false,noPenalty:false,img:item.img||null,url:item.url||null,wrong:item.wrong||null,choices:item.choices||null};
  h.st.qs.push({theme:th.name, cost:item.cost, text:(item.text||"🖼").slice(0,90), answer:item.answer, res:null, by:null, tries:[]});
  sendMedia(h.cur);
  h.tried={}; h.responder=null; h.reaction=null; h.msg=""; h.said=null; h.quiz=null;
  if(QUIZ()){ startQuiz(); return; }
  if(sp==="cat"){ h.phase="cat"; autoLater(20000, ()=>{ const x=H(); if(x.phase==="cat"&&x.cur===h.cur){ const o=online().filter(i=>i!==x.chooser); catGive(o.length?o[Math.floor(Math.random()*o.length)]:x.chooser); } }); pushState(); return; }
  if(sp==="auction"){ startAuction(); return; }
  if(sp==="norisk" && h.chooser){ h.cur.direct=true; h.cur.noPenalty=true; h.responder=h.chooser; h.phase="answer"; armAnswer(); pushState(); return; }
  startReading();
}
function sendMedia(c){
  if(!CFG.phoneImg || !c.img) return;
  imgGet(c.img).then(d=>{ if(d && HOST && H().cur===c) hRef("media").set({id:c.img, data:d}); });
}
function preloadPackImages(){ PACK.rounds.forEach(r=>r.themes.forEach(t=>t.questions.forEach(q=>{ if(q.img) imgGet(q.img); }))); }
function tvImg(c){ const src=imgSrc(c); return (c.img||c.url) ? (src?`<img class="qimg" src="${esc(src)}" alt="">`:`<div class="sub">Загружаем картинку…</div>`) : ""; }
function startReading(){
  const h=H(); h.phase="reading"; h.readMs=Math.min(5000, 1500+(h.cur.text||"").length*30); h.readAt=now();
  pushState(); later(openBuzz, h.readMs);
}
function openBuzz(){
  const h=H(); clearTimers();
  h.qn=(h.qn||0)+1; h.phase="open"; h.openAt=now(); h.buzzLock=false;
  const qn=h.qn;
  if(HOST.buzzRef) HOST.buzzRef.off();
  HOST.buzzRef=hRef(`buzz/${qn}`);
  HOST.buzzRef.on("child_added", ()=>{ const x=H(); if(x.phase!=="open"||x.qn!==qn||x.buzzLock) return; x.buzzLock=true; setTimeout(()=>resolveBuzz(qn),180); });
  setDl(CFG.window);
  pushState();
}
async function resolveBuzz(qn){
  const h=H(); if(h.phase!=="open" || h.qn!==qn) return;
  const all=(await hRef(`buzz/${qn}`).once("value")).val()||{};
  const cand=Object.entries(all).filter(([id,ts])=>!h.tried[id] && HOST.players[id] && typeof ts==="number").sort((a,b)=>a[1]-b[1]);
  if(!cand.length){ h.buzzLock=false; if(h.dl && now()>=h.dl) onExpire(); return; }
  clearTimers();
  const [id,ts]=cand[0]; h.responder=id; h.reaction=Math.max(0,(ts-h.openAt)/1000); h.phase="answer"; armAnswer(); pushState();
}
function setDl(ms){
  const h=H(); h.dlKey=(h.dlKey||0)+1; const k=h.dlKey;
  if(ms>0){ h.dl=now()+ms; h.dlTotal=ms; setTimeout(()=>{ if(HOST && H().dlKey===k) onExpire(); }, ms); }
  else { h.dl=0; h.dlTotal=0; }
}
function onExpire(){
  const h=H();
  if(h.phase==="open" && !h.buzzLock){ const q=stQ(); if(q) q.res="nobody"; reveal("Никто не ответил", null); }
  else if(h.phase==="quiz") quizReveal();
  else if(h.phase==="answer" && AUTO()){ h.said="— (время вышло)"; judge(false); }
}
function addTime(ms){ const h=H(); const left=h.dl>0?Math.max(0,h.dl-now()):0; setDl(left+ms); pushState(); }
function stopTime(){ setDl(0); pushState(); }
function armAnswer(){
  const h=H(); h.said=null; h.ansDeadline=0;
  if(AUTO()){ setDl(CFG.ansTime); h.ansDeadline=h.dl||1; } else setDl(0);
}
function judge(ok){
  const h=H(); if(h.phase!=="answer") return;
  const id=h.responder, c=h.cur.cost, nm=pname(id), said=h.said?` «${h.said}»`:"";
  const q=stQ(); if(q) q.tries.push({id, ok:!!ok});
  if(ok){ addScore(id,c); stRight(id, h.reaction); if(q){ q.res="right"; q.by=id; } h.chooser=id; reveal(nm+said+": верно, +"+fmt(c), true); return; }
  stWrong(id);
  const fine=(CFG.minus && !h.cur.noPenalty)?c:0; if(fine) addScore(id,-fine); h.tried[id]=true;
  const tail=fine?", −"+fmt(fine):"";
  if(h.cur.direct || !online().some(x=>!h.tried[x])){ if(q) q.res="wrong"; reveal(nm+said+": неверно"+tail, false); return; }
  h.msg=nm+said+" — неверно"+tail; h.responder=null; openBuzz();
}
function reveal(msg, ok){ clearTimers(); const h=H(); h.dlKey=(h.dlKey||0)+1; h.dl=0; h.phase="reveal"; h.msg=msg; h.msgOk=ok; h.responder=null; pushState(); later(toBoard, QUIZ()?6000:5000); }
function toBoard(){
  clearTimers(); const h=H(); h.msg=""; h.quiz=null; hRef("media").remove();
  const total=PACK.rounds[h.round].themes.reduce((a,t)=>a+t.questions.length,0);
  if(Object.keys(h.used).length>=total){ endRound(); return; }
  h.phase="board"; armBoard(); pushState();
}
function endRound(){
  clearTimers(); const h=H();
  if(h.round < PACK.rounds.length-1){
    h.round++; h.used={}; h.phase="board";
    const ids=online(); if(ids.length) h.chooser=ids.slice().sort((a,b)=>(HOST.players[a].score||0)-(HOST.players[b].score||0))[0];
    armBoard(); pushState();
  } else startFinal();
}
function catGive(to){ const h=H(); if(h.phase!=="cat") return; clearTimers(); h.responder=to; h.cur.direct=true; h.phase="answer"; h.reaction=null; armAnswer(); pushState(); }
function startAuction(){
  const h=H(), ids=online(); let i=ids.indexOf(h.chooser); if(i<0){ h.chooser=ids[0]; i=0; }
  const q=[...ids.slice(i+1),...ids.slice(0,i)];
  h.auc={bid:h.cur.cost, leader:h.chooser, queue:q, log:[pname(h.chooser)+" открывает торги: "+fmt(h.cur.cost)]};
  h.phase="auction"; if(!q.length) aucFinish(); else { armAuc(); pushState(); }
}
function armAuc(){ const a=H().auc, k=a.log.length+":"+a.queue[0]; autoLater(15000, ()=>{ const x=H(); if(x.phase==="auction" && x.auc.log.length+":"+x.auc.queue[0]===k) aucAct(x.auc.queue[0],"pass"); }); }
function aucAct(id, act){
  const h=H(), a=h.auc; if(h.phase!=="auction" || a.queue[0]!==id) return;
  const sc=(HOST.players[id]||{}).score||0;
  if(act==="raise" && sc<a.bid+100) return;
  if(act==="all" && sc<=a.bid) return;
  a.queue.shift();
  if(act==="pass") a.log.push(pname(id)+": пас");
  else { const bid=act==="all"?sc:a.bid+100; a.queue.push(a.leader); a.leader=id; a.bid=bid; a.log.push(pname(id)+(act==="all"?": ва-банк, ":": ")+fmt(bid)); }
  if(!a.queue.length) aucFinish(); else { armAuc(); pushState(); }
}
function aucFinish(){ const h=H(); clearTimers(); h.responder=h.auc.leader; h.cur.cost=h.auc.bid; h.cur.direct=true; h.reaction=null; h.phase="answer"; armAnswer(); pushState(); }

/* ---- quiz (multiple choice) ---- */
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function makeOptions(answer, wrong, theme, choices){
  if(choices && choices.length>=2){ const ci=choices.findIndex(x=>normA(x)===normA(answer)); if(ci>=0) return {opts:choices.slice(), correct:ci}; }
  const A=String(answer||"").trim(), na=normA(A), seen=new Set([na]), out=[];
  const add=x=>{ x=String(x||"").trim(); const n=normA(x); if(x && n && !seen.has(n) && out.length<3){ seen.add(n); out.push(x); } };
  (wrong||[]).forEach(add);
  if(out.length<3 && /^-?\d+([.,]\d+)?$/.test(A)){
    const v=parseFloat(A.replace(",",".")), int=Number.isInteger(v), isYear=int && v>1000 && v<2100;
    const deltas=shuffle(isYear?[1,2,3,5,7,10,-1,-2,-3,-5,-7,-10]:int&&Math.abs(v)<20?[1,2,3,-1,-2,4,-3]:[.1,.2,.25,.4,-.1,-.2,-.3,.5]);
    for(const d of deltas){ let n=isYear||(int&&Math.abs(v)<20)? v+d : v*(1+d); n=int?Math.round(n):Math.round(n*10)/10; if(n>0||v<=0) add(String(n)); }
  }
  if(out.length<3){
    const same=[], other=[];
    PACK.rounds.forEach(r=>r.themes.forEach(t=>t.questions.forEach(q=>(t.name===theme?same:other).push(q.answer))));
    if(PACK.final) other.push(PACK.final.answer);
    const sim=x=>Math.abs(String(x).length-A.length);
    shuffle(same).forEach(add); other.sort((a,b)=>sim(a)-sim(b)).slice(0,12).forEach(x=>{ if(Math.random()<.7) add(x); }); other.forEach(add);
  }
  const opts=shuffle([A, ...out]);
  return {opts, correct:opts.indexOf(A)};
}
function startQuiz(){
  const h=H(), o=makeOptions(h.cur.answer, h.cur.wrong, h.cur.theme, h.cur.choices);
  h.qn=(h.qn||0)+1; h.quiz={id:h.qn, opts:o.opts, correct:o.correct, picks:{}, start:now()};
  h.phase="quiz"; setDl(CFG.quizTime); pushState();
}
function quizPick(pid, v){
  const h=H(), z=h.quiz; if(h.phase!=="quiz" || !z || +v.qid!==z.id || z.picks[pid] || !HOST.players[pid]) return;
  const i=+v.i; if(!(i>=0 && i<z.opts.length)) return;
  z.picks[pid]={i, t:Math.max(0,(now()-z.start)/1000)};
  if(online().every(id=>z.picks[id])) quizReveal(); else pushState();
}
function quizReveal(){
  const h=H(), z=h.quiz, c=h.cur.cost, q=stQ(); if(h.phase!=="quiz") return;
  clearTimers();
  const right=[]; Object.entries(z.picks).forEach(([pid,p])=>{ const ok=p.i===z.correct; if(q) q.tries.push({id:pid, ok}); if(ok){ addScore(pid,c); stRight(pid,p.t); right.push([pid,p.t]); } else { stWrong(pid); if(CFG.minus && CFG.quizMinus) addScore(pid,-c); } });
  right.sort((a,b)=>a[1]-b[1]);
  if(right.length){ h.chooser=right[0][0]; if(q){ q.res="right"; q.by=right[0][0]; q.quiz=[right.length, online().length]; } }
  else if(q){ q.res=Object.keys(z.picks).length?"wrong":"nobody"; q.quiz=[0, online().length]; }
  z.done=true;
  reveal(right.length ? `Верно ответили ${right.length} из ${online().length}. Быстрее всех: ${pname(right[0][0])}` : "Никто не ответил верно", right.length>0);
}

/* ---- final ---- */
function startFinal(){
  clearTimers(); const h=H();
  if(!CFG.final || !PACK.final){ h.phase="end"; pushState(); return; }
  const ids=online().filter(id=>(HOST.players[id].score||0)>0);
  if(!ids.length){ h.phase="end"; pushState(); return; }
  h.fin={ids, bets:{}, answers:{}, verdict:{}};
  if(QUIZ()){ const o=makeOptions(PACK.final.answer, PACK.final.wrong, "", PACK.final.choices); h.fin.opts=o.opts; }
  h.phase="final-bet"; autoLater(30000, ()=>checkBets(true)); pushState();
}
function checkBets(force){
  const h=H(); if(h.phase!=="final-bet") return;
  if(force || h.fin.ids.every(id=>h.fin.bets[id]!=null)){ h.fin.ids.forEach(id=>{ if(h.fin.bets[id]==null) h.fin.bets[id]=1; }); h.phase="final-answer"; clearTimers(); autoLater(45000, ()=>checkAnswers(true)); }
  pushState();
}
function checkAnswers(force){
  const h=H(); if(h.phase!=="final-answer") return;
  if(force || h.fin.ids.every(id=>h.fin.answers[id]!=null)){
    clearTimers();
    h.fin.ids.forEach(id=>{ if(h.fin.answers[id]==null) h.fin.answers[id]="—"; }); h.phase="final-judge";
    if(AUTO() || QUIZ()) h.fin.ids.forEach((id,i)=>later(()=>finalJudge(id, QUIZ()? normA(h.fin.answers[id])===normA(PACK.final.answer) : matchAnswer(h.fin.answers[id], PACK.final.answer)), 1300*(i+1)));
  }
  pushState();
}
function finalJudge(id, ok){
  const h=H(); if(h.phase!=="final-judge" || h.fin.verdict[id]!=null) return;
  h.fin.verdict[id]=ok; addScore(id, ok?h.fin.bets[id]:-h.fin.bets[id]);
  if(ok) stP(id).finalOk=true; else stP(id).finalOk=false;
  if(h.fin.ids.every(i=>h.fin.verdict[i]!=null)) h.phase="end";
  pushState();
}
function hostTimeBtnsAllowed(){ const h=H(); return ["open","quiz"].includes(h.phase) || (h.phase==="answer" && AUTO()); }
function skipQuestion(){ const h=H(); if(!h.cur || ["board","end","lobby"].includes(h.phase)) return; const q=stQ(); if(q) q.res="nobody"; if(h.quiz) h.quiz.done=false; h.quiz=null; reveal("Вопрос пропущен", null); }
function undoQuestion(){ const h=H(); if(!h.cur || ["board","end","lobby","reveal"].includes(h.phase) || h.phase.startsWith("final")) return; clearTimers(); h.dlKey=(h.dlKey||0)+1; h.dl=0; delete h.used[h.cur.ti+"-"+h.cur.qi]; if(h.st && h.st.qs.length) h.st.qs.pop(); h.cur=null; h.quiz=null; h.responder=null; h.msg=""; hRef("media").remove(); h.phase="board"; armBoard(); pushState(); }
function giveAnswer(pid){ const h=H(); if(!h.cur || !["reading","open","answer"].includes(h.phase) || QUIZ()) return; clearTimers(); h.responder=pid; h.reaction=null; h.phase="answer"; armAnswer(); pushState(); }
function setChooser(pid){ const h=H(); h.chooser=pid; if(h.phase==="board"){ clearTimers(); armBoard(); } pushState(); }
function backToLobby(){ clearTimers(); Object.assign(H(),{phase:"lobby", cur:null, responder:null, fin:null, auc:null, quiz:null, used:{}, round:0}); S.view="setup"; APP.mode="host"; pushState(); }
function statsOut(){
  const h=H(); if(!h.st) return null;
  const players=order().map(id=>{ const s=h.st.pl[id]||{}; return {id, name:pname(id), score:HOST.players[id].score||0, right:s.right||0, wrong:s.wrong||0, best:s.best==null?null:s.best, fin:s.finalOk==null?null:s.finalOk}; }).sort((a,b)=>b.score-a.score);
  const qs=h.st.qs.map(q=>({t:q.theme, c:q.cost, x:q.text, a:q.answer, r:q.res||"nobody", by:q.by?pname(q.by):null, n:q.quiz||null, w:q.tries.filter(t=>!t.ok).map(t=>pname(t.id))}));
  const themes={}; h.st.qs.forEach(q=>{ const t=themes[q.theme]||(themes[q.theme]={n:0,ok:0}); t.n++; if(q.res==="right") t.ok++; });
  const hard=Object.entries(themes).filter(([,v])=>v.n>=2).sort((a,b)=>a[1].ok/a[1].n-b[1].ok/b[1].n)[0];
  const fast=players.filter(p=>p.best!=null).sort((a,b)=>a.best-b.best)[0];
  return {players, qs, total:qs.length, ok:qs.filter(q=>q.r==="right").length, hard:hard?{t:hard[0], ok:hard[1].ok, n:hard[1].n}:null, fast:fast?{name:fast.name, best:fast.best}:null};
}

/* ---- organizer plays too (no-host mode) ---- */
function syncSelf(){
  if(!HOST) return;
  if(AUTO() && !PL) joinRoom(HOST.code, hostName(), {silent:true});
  else if(!AUTO() && PL && PL.code===HOST.code) dropSelf(true);
}
function dropSelf(remove){
  if(!PL) return;
  pRef("state").off(); pRef("players").off(); pRef("meta").off(); pRef("media").off();
  pRef(`players/${PL.pid}/online`).onDisconnect().cancel();
  if(remove) pRef(`players/${PL.pid}`).remove();
  PL=null;
}
let WAKE=null;
async function keepAwake(){ try{ if(navigator.wakeLock && !WAKE){ WAKE=await navigator.wakeLock.request("screen"); WAKE.addEventListener("release",()=>{ WAKE=null; }); } }catch(e){} }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && HOST && H().phase!=="lobby") keepAwake(); });

/* ================= PLAYER ================= */
const pRef = p => ref(`rooms/${PL.code}/${p}`);
async function joinRoom(code, name, opt){
  opt=opt||{};
  APP.busy=true; APP.joinErr=""; render();
  try{
    if(!/^\d{4}$/.test(code)) throw "Код состоит из 4 цифр";
    const m=(await ref(`rooms/${code}/meta`).once("value")).val();
    if(!m || m.closed) throw "Комната с таким кодом не найдена";
    const key="svoya.pid."+code; let pid=load(key,null);
    const ps=(await ref(`rooms/${code}/players`).once("value")).val()||{};
    if(!(pid && ps[pid])){
      const cnt=Object.values(ps).filter(p=>p.online!==false).length;
      if(m.access==="public" && m.max && cnt>=m.max) throw "В комнате нет свободных мест";
      pid=uid(); save(key,pid);
      await ref(`rooms/${code}/players/${pid}`).set({name, score:0, online:true, joined:TS()});
    } else await ref(`rooms/${code}/players/${pid}`).update({name, online:true});
    PL={code, pid, name, state:null, players:{}, meta:m, lock:0, pressedQn:null, sent:{}, seenSelf:false, kicked:false};
    pRef(`players/${pid}/online`).onDisconnect().set(false);
    pRef("state").on("value", s=>{ const prev=PL&&PL.state; PL.state=s.val(); if(prev && PL.state && prev.qn!==PL.state.qn) PL.pressedQn=null; if(PL.state && PL.state.phase==="lobby") PL.sent={}; render(); });
    pRef("players").on("value", s=>{ PL.players=Object.fromEntries(Object.entries(s.val()||{}).filter(([k,p])=>p&&p.name)); if(PL.players[pid] && PL.players[pid].name!==PL.name){ PL.name=PL.players[pid].name; ME_NAME=PL.name; save("svoya.name",PL.name); } if(PL.players[pid]) PL.seenSelf=true; else if(PL.seenSelf && !PL.kicked){ PL.kicked=true; pRef(`players/${pid}/online`).onDisconnect().cancel(); } render(); });
    pRef("meta").on("value", s=>{ PL.meta=s.val()||{}; render(); });
    pRef("media").on("value", s=>{ PL.media=s.val(); render(); });
    if(!opt.silent){ save("svoya.lastRoom", code); APP.mode="player"; history.replaceState(null,"",location.pathname+"?room="+code); }
  }catch(e){ console.error(e); APP.joinErr = typeof e==="string" ? e : "Не удалось подключиться. Проверьте интернет."; }
  APP.busy=false; render();
}
function leaveRoom(){
  if(PL){ pRef("state").off(); pRef("players").off(); pRef("meta").off(); pRef("media").off(); pRef(`players/${PL.pid}/online`).onDisconnect().cancel(); if(!PL.kicked && PL.players[PL.pid]) pRef(`players/${PL.pid}/online`).set(false); }
  PL=null; save("svoya.lastRoom",null); history.replaceState(null,"",location.pathname); goHome();
}
function send(kind, data){ pRef(`input/${PL.pid}`).set(Object.assign({kind, n:Date.now()+"-"+Math.random().toString(36).slice(2,6)}, data||{})); }
function plBuzz(){
  const st=PL&&PL.state; if(!st) return; const t=Date.now();
  if(st.phase==="reading"){ if(st.cfg.early){ PL.lock=t+500; PL.early=true; render(); setTimeout(()=>{ if(PL){ PL.early=false; render(); } },400); } return; }
  if(st.phase!=="open" || (st.tried||{})[PL.pid] || PL.pressedQn===st.qn || t<PL.lock) return;
  PL.pressedQn=st.qn; pRef(`buzz/${st.qn}/${PL.pid}`).set(TS());
  if(navigator.vibrate) navigator.vibrate(40);
  render();
}

/* ================= navigation ================= */
function goHome(){
  APP.mode="home"; APP.homeView=APP.prefill?"code":"main"; APP.joinErr="";
  PACK=clone(findPack(PACK_ID)); render();
}
function setHomeView(v){
  APP.homeView=v; APP.joinErr="";
  if(APP.pubRef){ APP.pubRef.off(); APP.pubRef=null; }
  if(v==="rooms" && APP.dbOk){ APP.pubRef=ref("public"); APP.pubRef.on("value", s=>{ APP.publicRooms=s.val()||{}; render(); }); }
  render();
}

/* ================= render helpers ================= */
function preserve(el, html){
  const vals={}, act=document.activeElement, fid=act&&el.contains(act)?act.id:null;
  el.querySelectorAll("input[id],textarea[id]").forEach(i=>{ if(i.type!=="range"||i.dataset.keep) vals[i.id]={v:i.value, s:i.selectionStart}; });
  el.innerHTML=html;
  Object.entries(vals).forEach(([id,o])=>{ const i=document.getElementById(id); if(i && i.dataset.fresh!=="1"){ i.value=o.v; } });
  if(fid){ const i=document.getElementById(fid); if(i){ i.focus(); try{ if(vals[fid] && vals[fid].s!=null) i.setSelectionRange(vals[fid].s, vals[fid].s); }catch(e){} } }
}
function render(){
  const tv=document.getElementById("tv"), ps=document.getElementById("pshell");
  const hostMode = APP.mode==="host";
  tv.hidden=!hostMode; ps.hidden=hostMode;
  document.body.dataset.mode=APP.mode;
  if(hostMode) renderHost(); else if(APP.mode==="player") renderPlayer(); else renderHome();
}

    ${lr&&!hs?`<button class="entry resume" data-act="rejoin"><b>Вернуться в комнату ${esc(lr)}</b><span>Счёт сохранится</span></button>`:""}

    <button class="entry" data-home="code"><b>Войти по коду</b><span>Ведущий покажет код или QR на своём экране</span></button>
    <button class="entry" data-home="rooms"><b>Открытые игры</b><span>Присоединиться к игре, которую ведёт кто-то другой</span></button>`;

    ${APP.joinErr?`<div class="err-t">${esc(APP.joinErr)}</div>`:""}
    <button class="pbtn hot" data-act="join-code" ${APP.busy?"disabled":""}><span>${APP.busy?"Подключаемся…":"Войти"}</span><span></span></button>`;
  if(v==="rooms"){
    const t=now(), list=Object.entries(APP.publicRooms).filter(([c,r])=>r && (!r.ts || t-r.ts<6*3600e3)).sort((a,b)=>(a[1].status==="wait"?0:1)-(b[1].status==="wait"?0:1));
    b=`<button class="back" data-home="main">← Назад</button><div class="status">Открытые игры</div>
    <input class="field" id="nm" placeholder="Как вас называть" value="${esc(ME_NAME)}" maxlength="20" aria-label="Ваше имя" autocomplete="nickname">
    ${APP.joinErr?`<div class="err-t">${esc(APP.joinErr)}</div>`:""}
    ${list.length? list.map(([code,r])=>{ const full=r.count>=r.max, play=r.status==="play";

        <div class="meta2">Ведёт ${esc(r.host)} · ${esc(r.pack)} · ${r.count||0} из ${r.max}</div>

  preserve(el, `<div class="ph-body" style="padding-top:28px"><div class="home">${b}</div></div>`);

function accBadge(){ return CFG.access==="public" ? "Открытая · «"+esc(CFG.roomName||"Моя игра")+"» · до "+CFG.max : "Приватная · вход только по коду"; }
function updateLobby(){
  const box=document.getElementById("lobby-players"); if(!box) return;
  const ids=order();
  box.innerHTML = ids.length ? ids.map(id=>{ const p=HOST.players[id], on=p.online!==false;
    return `<div><button class="pl-name hren" data-hrename="${id}" title="Переименовать"><i class="on-dot ${on?"":"off"}"></i>${esc(p.name)} <span>✎</span></button><button class="ed-x" data-kick="${id}" aria-label="Удалить игрока ${esc(p.name)}">×</button></div>`; }).join("")
    : `<div class="wait">Ждём игроков: пусть отсканируют QR или введут код</div>`;
  const btn=document.getElementById("start-btn"), errs=validate(PACK).some(x=>x.lvl==="err");
  if(btn){ btn.disabled=!online().length||errs; btn.textContent=online().length?`Начать игру · ${online().length} ${plural(online().length,"игрок","игрока","игроков")}`:"Начать игру"; }
}
function drawQR(){
  const box=document.getElementById("qr"); if(!box) return;
  const url=joinURL(HOST.code);
  if(HOST.qrFor===url && HOST.qrImg){ box.innerHTML=`<img src="${HOST.qrImg}" alt="">`; return; }
  loadScript("https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js").then(()=>{
    const b=document.getElementById("qr"); if(!b) return; b.innerHTML="";
    new QRCode(b,{text:url,width:180,height:180,colorDark:"#121760",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});
    setTimeout(()=>{ const c=b.querySelector("canvas"); if(c){ HOST.qrImg=c.toDataURL(); HOST.qrFor=url; } },50);
  }).catch(()=>{ box.innerHTML=`<div style="color:#121760;font-size:12px;padding:8px">QR не загрузился</div>`; });
}
function roundLabel(h){
  if(["final-bet","final-answer","final-judge"].includes(h.phase)) return "Финал";
  if(h.phase==="end") return "Итоги";
  const r=PACK.rounds[h.round], total=r.themes.reduce((a,t)=>a+t.questions.length,0);
  return esc(r.name)+" · осталось "+(total-Object.keys(h.used).length);
}
function renderHostGame(){
  const h=H(), c=h.cur, ids=order();
  const scores=ids.map(id=>{
    const p=HOST.players[id], cls=["pl"]; let tag="";
    if(h.phase==="board" && h.chooser===id){ cls.push("choose"); tag="выбирает"; }
    if(h.responder===id && h.phase==="answer"){ cls.push("resp"); tag="отвечает"; }
    if(h.phase==="auction" && h.auc && h.auc.leader===id){ cls.push("choose"); tag="лидер"; }
    return `<button class="${cls.join(" ")}" data-menu="${id}" title="Действия с игроком"><div class="nm"><span><i class="on-dot ${p.online!==false?"":"off"}"></i>${esc(p.name)}</span><em>${tag}</em></div><div class="sc ${(p.score||0)<0?"neg":""}">${fmt(p.score||0)}</div></button>`;
  }).join("");
  let main="", host="";
  const ansLabel = c && c.choices ? (()=>{ const i=c.choices.findIndex(x=>normA(x)===normA(c.answer)); return (i>=0?LET[i]+") ":"")+c.answer; })() : (c?c.answer:"");
  const ansStrip=(active,extra)=>`<span class="lbl">Ответ</span><span class="ans">${esc(ansLabel)}</span><div class="btns">${extra||""}<button class="hb ok" data-act="ok" ${active?"":"disabled"}>Верно</button><button class="hb bad" data-act="bad" ${active?"":"disabled"}>Неверно</button></div>`;
  switch(h.phase){
    case "board":{
      const R=PACK.rounds[h.round], N=Math.max(1,...R.themes.map(t=>t.questions.length));
      main=`<div class="board" style="grid-template-columns:minmax(110px,1.6fr) repeat(${N},minmax(52px,1fr))">`+R.themes.map((t,ti)=>`<div class="theme">${esc(t.name)}</div>`+Array.from({length:N},(_,qi)=>{
        const q=t.questions[qi]; if(!q) return `<button class="cell" disabled></button>`;
        const used=h.used[ti+"-"+qi];
        return `<button class="cell" ${used?"disabled":""} data-pick="${ti}-${qi}" aria-label="${esc(t.name)} за ${q.cost}">${used?"":q.cost}</button>`;
      }).join("")).join("")+`</div>`;
      const ch=h.chooser?pname(h.chooser):"—";
      host=`<span class="lbl">Ход</span><span class="ans" style="color:#fff;font-weight:600">${picker()==="host"?`${esc(ch)} называет вопрос, откройте его на табло`:`${esc(ch)} выбирает вопрос на телефоне (можно открыть и отсюда)`}</span><div class="btns"><select class="hsel" data-chooser aria-label="Кто ходит">${online().map(x=>`<option value="${x}" ${x===h.chooser?"selected":""}>Ходит: ${esc(pname(x))}</option>`).join("")}</select><button class="hb neutral" data-act="rand-turn">Случайно</button><button class="hb neutral" data-act="low-turn">Отстающему</button></div>`;
      break;
    }
    case "reading":{
      const el=Math.max(0,now()-h.readAt);
      main=`<div class="q"><div class="meta">${esc(c.theme)} · ${c.cost}</div>${tvImg(c)}<div class="text">${esc(c.text)}</div>${c.choices&&h.phase!=="quiz"?optsHTML(c.choices,null,null):""}<div class="sub">Прочитайте вопрос вслух, кнопки пока заблокированы</div><div class="bar read" style="animation-duration:${h.readMs}ms;animation-delay:-${el}ms"></div></div>`;
      host=ansStrip(false,`<button class="hb neutral" data-act="open-now">Открыть кнопки</button>`); break;
    }
    case "open":{
      const el=Math.max(0,now()-h.openAt);
      main=`<div class="q"><div class="meta">${esc(c.theme)} · ${c.cost}</div>${tvImg(c)}<div class="text">${esc(c.text)}</div>${c.choices&&h.phase!=="quiz"?optsHTML(c.choices,null,null):""}<div class="sub">${h.msg?esc(h.msg)+". ":""}Кнопки открыты${h.dl?"":" · без лимита времени"}</div>${h.dl?`<div class="bar" style="animation-duration:${h.dlTotal}ms;animation-delay:-${Math.max(0,h.dlTotal-(h.dl-now()))}ms"></div>`:""}</div>`;
      host=ansStrip(false,timeBtns()+`<button class="hb neutral" data-act="nobody">Никто</button>`); break;
    }
    case "answer":{
      const how=c.sp==="cat"?"Кот в мешке":c.sp==="auction"?"Аукцион":c.sp==="norisk"?"Вопрос без риска":(h.reaction!=null?`нажал первым за ${h.reaction.toFixed(2).replace(".",",")} с`:"");
      main=`<div class="q"><div class="meta">${esc(c.theme)} · ${fmt(c.cost)}</div>${tvImg(c)}<div class="text">${esc(c.text)}</div>${c.choices&&h.phase!=="quiz"?optsHTML(c.choices,null,null):""}<div class="sub">Отвечает ${esc(pname(h.responder))}${how?" · "+how:""}</div></div>`;
      host=AUTO()? `<span class="lbl">Автопроверка</span><span class="ans" style="color:#fff;font-weight:600">${esc(pname(h.responder))} отвечает на телефоне · ${esc(ansLabel)}</span><div class="btns">${timeBtns()}<button class="hb ok" data-act="ok">Засчитать</button><button class="hb bad" data-act="bad">Не засчитать</button></div>` : ansStrip(true); break;
    }
    case "quiz":{
      const z=h.quiz, el=Math.max(0,now()-z.start), n=Object.keys(z.picks).length;
      main=`<div class="q"><div class="meta">${esc(c.theme)} · ${c.cost}</div>${tvImg(c)}<div class="text">${esc(c.text)}</div>${c.choices&&h.phase!=="quiz"?optsHTML(c.choices,null,null):""}${optsHTML(z.opts,null,null)}<div class="sub">Ответили ${n} из ${online().length}${h.dl?"":" · без лимита времени"}</div>${h.dl?`<div class="bar" style="animation-duration:${h.dlTotal}ms;animation-delay:-${Math.max(0,h.dlTotal-(h.dl-now()))}ms"></div>`:""}</div>`;
      host=`<span class="lbl">Ответ</span><span class="ans">${esc(ansLabel)}</span><div class="btns">${timeBtns()}<button class="hb neutral" data-act="quiz-end">Показать ответ</button></div>`; break;
    }
    case "reveal":
      if(h.quiz && h.quiz.done){ const cnt=h.quiz.opts.map((_,i)=>Object.values(h.quiz.picks).filter(p=>p.i===i).length);
        main=`<div class="q"><div class="meta">${esc(c.theme)} · ${fmt(c.cost)}</div><div class="text">${esc(c.text)}</div>${optsHTML(h.quiz.opts,h.quiz.correct,null,cnt)}<div class="sub">${esc(h.msg)}</div></div>`; }
      else main=`<div class="q"><div class="meta">${esc(c.theme)} · ${fmt(c.cost)}</div><div class="big">${esc(c.answer)}</div><div class="sub">${esc(h.msg)}</div></div>`;
      host=`<span class="lbl">Пульт</span><span class="ans"></span><div class="btns"><button class="hb neutral" data-act="next">Дальше</button></div>`; break;
    case "cat":
      main=`<div class="q"><div class="big">Кот в мешке</div><div class="sub">${esc(pname(h.chooser))} отдаёт вопрос сопернику с телефона. Тема «${esc(c.theme)}», ${c.cost}. Отвечают без кнопки.</div></div>`;
      host=`<span class="lbl">Отдать за игрока</span><div class="btns" style="flex-wrap:wrap">${online().filter(x=>x!==h.chooser).map(x=>`<button class="hb neutral" data-catto="${x}">${esc(pname(x))}</button>`).join("")}</div>`; break;
    case "auction":{
      const a=h.auc, turn=a.queue[0];
      main=`<div class="q"><div class="big">Аукцион</div><div class="meta" style="margin-top:12px">${esc(c.theme)} · ставка ${fmt(a.bid)} · лидер ${esc(pname(a.leader))}</div><div class="sub">${a.log.map(esc).join("<br>")}${turn?`<br><b>Ход: ${esc(pname(turn))}</b>`:""}</div></div>`;
      host=`<span class="lbl">Торги</span><span class="ans" style="color:#fff;font-weight:600">${turn?"Ходит "+esc(pname(turn)):""}</span><div class="btns"><button class="hb neutral" data-act="auc-skip">Пас за игрока</button><button class="hb neutral" data-act="auc-end">Завершить торги</button></div>`; break;
    }
    case "final-bet":
      main=`<div class="q"><div class="meta">Финал</div><div class="big">${esc(PACK.final.theme)}</div><div class="sub">Игроки делают ставки на телефонах. Сделано: ${Object.keys(h.fin.bets).length} из ${h.fin.ids.length}</div></div>`;
      host=`<span class="lbl">Финал</span><span class="ans" style="color:#fff;font-weight:600">${h.fin.ids.map(esc2=>esc(pname(esc2))).join(", ")}</span><div class="btns"><button class="hb neutral" data-act="force-bets">Не ждать</button></div>`; break;
    case "final-answer":
      main=`<div class="q"><div class="meta">Финал · ${esc(PACK.final.theme)}</div><div class="text">${esc(PACK.final.text)}</div><div class="sub">Ответы пишут на телефонах. Получено: ${Object.keys(h.fin.answers).length} из ${h.fin.ids.length}</div></div>`;
      host=`<span class="lbl">Ответ</span><span class="ans">${esc(PACK.final.answer)}</span><div class="btns"><button class="hb neutral" data-act="force-answers">Не ждать</button></div>`; break;
    case "final-judge":
      main=`<div class="q"><div class="meta">Финал · ${esc(PACK.final.theme)}</div><div class="text">${esc(PACK.final.text)}</div><div class="sub">Проверьте ответы</div></div>`;
      host=`<div class="judge-list"><div><span class="lbl">Правильный ответ:</span> <b style="color:var(--gold)">${esc(PACK.final.answer)}</b></div>`+h.fin.ids.map(id=>{ const v=h.fin.verdict[id];
        return `<div class="judge-row"><span class="who">${esc(pname(id))}</span><span class="said">«${esc(h.fin.answers[id]||"—")}» · ставка ${fmt(h.fin.bets[id])}</span>${v==null?`<button class="hb ok" data-fj="${id}:1">Верно</button><button class="hb bad" data-fj="${id}:0">Неверно</button>`:`<span class="done">${v?"✓":"✗"}</span>`}</div>`; }).join("")+`</div>`; break;
    case "end":{
      main=statsHTML(statsOut(), false);
      host=`<span class="lbl">Пульт</span><span class="ans"></span><div class="btns"><button class="hb neutral" data-act="lobby">Новая игра с теми же игроками</button></div>`; break;
    }
  }
  const qtools = c && ["reading","open","answer","quiz","cat","auction"].includes(h.phase) ? `<div class="qtools"><button class="hb neutral" data-act="skip-q">Пропустить вопрос</button><button class="hb neutral" data-act="undo-q">Вернуть на табло</button><span class="lbl">Нажмите на игрока, чтобы дать ему ответить, передать ход или изменить очки</span></div>` : `<div class="qtools"><span class="lbl">Нажмите на игрока: ход, очки, имя</span></div>`;
  let skip="";
  if(h.phase==="board") skip = h.round<PACK.rounds.length-1 ? "Следующий раунд" : (CFG.final&&PACK.final?"К финалу":"Завершить игру");
  document.getElementById("tv").innerHTML=`
    <div class="tv-head"><span class="tv-title">${roundLabel(h)} · комната ${HOST.code}</span><div style="display:flex;gap:8px;flex-wrap:wrap">${skip?`<button class="ghost" data-act="skip">${skip}</button>`:""}${PL?`<button class="ghost" data-act="to-phone">Мой телефон</button>`:""}<button class="ghost" data-act="lobby">В лобби</button><button class="ghost" data-act="close-room">Закрыть</button></div></div>
    <div class="scores" style="grid-template-columns:repeat(${Math.min(Math.max(ids.length,1),6)},1fr)">${scores||`<div class="pl">Игроков нет</div>`}</div>${main}<div class="host">${host}</div>${h.phase==="end"?"":qtools}${S.menu?hostMenuHTML():""}`;
}

/* ================= shared: options & stats ================= */
function dlBar(dl, total, cls){
  if(!dl) return `<div class="nolimit">⏱ без лимита времени</div>`;
  const left=Math.max(0, dl-now()), T=Math.max(total||left,1);
  return `<div class="${cls||"timer"}"><i style="animation-duration:${T}ms;animation-delay:-${Math.max(0,T-left)}ms"></i></div>`;
}
const LET="АБВГДЕ";
function optsHTML(opts, correct, mine, counts, clickable){
  return `<div class="opts">`+arr(opts).map((o,i)=>{
    const cls=["opt-b"]; if(correct!=null){ if(i===correct) cls.push("ok"); else if(i===mine) cls.push("bad"); else cls.push("dim"); } else if(i===mine) cls.push("sel");
    const inner=`<b>${LET[i]}</b><span>${esc(o)}</span>${counts?`<em>${counts[i]}</em>`:""}`;
    return clickable ? `<button class="${cls.join(" ")}" data-${clickable}="${i}">${inner}</button>` : `<div class="${cls.join(" ")}">${inner}</div>`;
  }).join("")+`</div>`;
}
function statsHTML(S2, phone, meName){
  if(!S2) return `<div class="q"><div class="big">Игра окончена</div></div>`;
  const P=arr(S2.players), top=P.slice(0,3), medal=["🥇","🥈","🥉"];
  const win=P[0] && P[0].score>0 ? P[0] : null;
  const pod=`<div class="podium">${[1,0,2].filter(i=>top[i]).map(i=>`<div class="pod p${i+1}"><div class="pm">${medal[i]}</div><div class="pn">${esc(top[i].name)}</div><div class="ps">${fmt(top[i].score)}</div><div class="pb">${i+1}</div></div>`).join("")}</div>`;
  const hl=[`Сыграно вопросов: <b>${S2.total}</b>, отвечено верно: <b>${S2.ok}</b>${S2.total?` (${Math.round(S2.ok/S2.total*100)}%)`:""}`];
  if(S2.fast) hl.push(`Самая быстрая реакция: <b>${esc(S2.fast.name)}</b>, ${String(S2.fast.best).replace(".",",")} с`);
  if(S2.hard) hl.push(`Самая сложная тема: <b>${esc(S2.hard.t)}</b>, верно ${S2.hard.ok} из ${S2.hard.n}`);
  const table=`<div class="st-wrap"><table class="st"><thead><tr><th>#</th><th>Игрок</th><th>Очки</th><th>Верно</th><th>Ошибки</th><th>Реакция</th></tr></thead><tbody>${P.map((p,i)=>`<tr${meName&&p.name===meName?' class="me-row"':""}><td>${i+1}</td><td>${esc(p.name)}${p.fin===true?" ✓ф":p.fin===false?" ✗ф":""}</td><td>${fmt(p.score)}</td><td>${p.right}</td><td>${p.wrong}</td><td>${p.best!=null?String(p.best).replace(".",",")+" с":"—"}</td></tr>`).join("")}</tbody></table></div>`;
  const qs=arr(S2.qs).map(q=>`<li class="${q.r==="right"?"r":q.r==="wrong"?"w":"n"}"><div><b>${esc(q.t)} · ${q.c}</b> ${esc(q.x)}</div><div class="qa">Ответ: ${esc(q.a)} · ${q.r==="right"?(q.n?`верно ${arr(q.n)[0]} из ${arr(q.n)[1]}, первым `:"ответил ")+esc(q.by):q.r==="wrong"?"никто не ответил верно":"никто не отвечал"}${arr(q.w).length&&!q.n?` · ошиблись: ${arr(q.w).map(esc).join(", ")}`:""}</div></li>`).join("");
  return `<div class="endscreen ${phone?"ph":""}"><div class="meta">Игра окончена</div><div class="big">${win?esc(win.name)+(phone&&win.name===meName?", вы победили!":" побеждает!"):"Победителя нет"}</div>${pod}<div class="hl">${hl.map(x=>`<div>${x}</div>`).join("")}</div>${table}${qs?`<details class="qst" ${phone?"":"open"}><summary>Статистика по вопросам</summary><ol>${qs}</ol></details>`:""}</div>`;
